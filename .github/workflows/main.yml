name: RDP-Fast

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: System Optimization
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          $svcs = @("DiagTrack","dmwappushservice","SysMain","WSearch","MapsBroker","RetailDemo","XblAuthManager","XblGameSave","XboxNetApiSvc","XboxGipSvc","WerSvc","Fax","PhoneSvc","PrintNotify","RemoteRegistry","wisvc","WMPNetworkSvc","Cortana","OneSyncSvc","MessagingService","PcaSvc","TabletInputService","FontCache","WpnService","WpnUserService","BITS","edgeupdate","edgeupdatem","MicrosoftEdgeElevationService","Spooler","BluetoothUserService","bthserv","ShellHWDetection","SCardSvr","ScDeviceEnum","WbioSrvc","SensrSvc","SensorService","SharedAccess","icssvc","lfsvc","SEMgrSvc","NaturalAuthentication","NcaSvc","NcbService","RmSvc","SmsRouter","TapiSrv","TieringEngineService","TokenBroker","WalletService","WebClient","stisvc","WiaRpc","PrintWorkflowUserSvc","CloudExperienceHostUserService","DcpSvc","AssignedAccessManagerSvc","CaptureService","ConsentUxUserSvc","CredentialEnrollmentManagerUserSvc","DeviceAssociationBrokerSvc","DevicePickerUserSvc","DevicesFlowUserSvc","LxssManager","UdkUserSvc","UnistoreSvc","UserDataSvc","PimIndexMaintenanceSvc","PrintScanBrokerService","DoSvc","diagnosticshub.standardcollector.service","GraphicsPerfSvc","InstallService","iphlpsvc","LanmanServer","lmhosts","NetTcpPortSharing","PrintSpooler","QWAVE","RemoteAccess","RetailDemoService","RpcLocator","seclogon","SensorDataService","SNMPTRAP","SSDPSRV","TrustedInstaller","upnphost","UsoSvc","vmicguestinterface","vmicheartbeat","vmickvpexchange","vmicrdv","vmicshutdown","vmictimesync","vmicvmsession","vmicvss","WaaSMedicSvc","WdiServiceHost","WdiSystemHost","WEPHOSTSVC","wercplsupport","WinHttpAutoProxySvc")
          foreach ($svc in $svcs) {
            try {
              $s = Get-Service -Name $svc -ErrorAction Stop
              if ($s.Status -eq "Running") { Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue }
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
            } catch { }
          }
          $taskPaths = @("\Microsoft\Windows\Application Experience\*","\Microsoft\Windows\Autochk\*","\Microsoft\Windows\Customer Experience Improvement Program\*","\Microsoft\Windows\DiskDiagnostic\*","\Microsoft\Windows\Feedback\Siuf\*","\Microsoft\Windows\Windows Error Reporting\*","\Microsoft\Windows\Maintenance\*","\Microsoft\Windows\Defrag\*","\Microsoft\Windows\Windows Defender\*","\Microsoft\Windows\UpdateOrchestrator\*","\Microsoft\Windows\CloudExperienceHost\*","\Microsoft\Windows\InstallService\*","\Microsoft\Windows\Speech\*","\Microsoft\Windows\Location\*","\Microsoft\Windows\Maps\*","\Microsoft\Windows\PushToInstall\*","\Microsoft\Windows\RetailDemo\*","\Microsoft\Windows\Shell\*","\Microsoft\Windows\SoftwareProtectionPlatform\*","\Microsoft\Windows\WaaSMedic\*","\Microsoft\Windows\WindowsUpdate\*","\Microsoft\Windows\Workplace Join\*")
          foreach ($tp in $taskPaths) {
            Get-ScheduledTask -TaskPath $tp -ErrorAction SilentlyContinue | Disable-ScheduledTask -ErrorAction SilentlyContinue | Out-Null
          }
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' VisualFXSetting 2 -Force -EA 0
          Set-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics' MinAnimate 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' EnableTransparency 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' MenuShowDelay 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' DragFullWindows 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' FontSmoothing 2 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' TaskbarAnimations 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' ListviewAlphaSelect 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' ListviewShadow 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' IconsOnly 1 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' ExtendedUIHoverTime 1 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' AlwaysShowMenus 1 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' ShowCompColor 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' AppsUseLightTheme 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' SystemUsesLightTheme 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' ColorPrevalence 0 -Force -EA 0
          New-Item -Path 'HKCU:\SOFTWARE\Microsoft\Windows\DWM' -Force -EA 0 | Out-Null
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\DWM' ColorPrevalence 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\DWM' AccentColor 0xFF000000 -Force -EA 0
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\DWM' AccentColorInactive 0xFF000000 -Force -EA 0
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\DWM' EnableWindowColorization 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' AppsUseLightTheme 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' SystemUsesLightTheme 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search' AllowCortana 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search' DisableWebSearch 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Search' ConnectedSearchUseWeb 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Search' BingSearchEnabled 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Search' CortanaConsent 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Search' SearchboxTaskbarMode 0 -Force -EA 0
          Set-MpPreference -DisableRealtimeMonitoring $true -EA 0
          Set-MpPreference -DisableBehaviorMonitoring $true -EA 0
          Set-MpPreference -DisableIOAVProtection $true -EA 0
          Set-MpPreference -DisableScriptScanning $true -EA 0
          Set-MpPreference -DisableIntrusionPreventionSystem $true -EA 0
          Set-MpPreference -MAPSReporting 0 -EA 0
          Set-MpPreference -SubmitSamplesConsent 2 -EA 0
          Set-MpPreference -DisableArchiveScanning $true -EA 0
          Set-MpPreference -DisableEmailScanning $true -EA 0
          Set-MpPreference -DisableRemovableDriveScanning $true -EA 0
          Set-MpPreference -DisableBlockAtFirstSeen $true -EA 0
          Set-MpPreference -PUAProtection 0 -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' EnableLUA 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' ConsentPromptBehaviorAdmin 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' PromptOnSecureDesktop 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\GameBar' AutoGameModeEnabled 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\GameBar' AllowAutoGameMode 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\System\GameConfigStore' GameDVR_Enabled 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\System\GameConfigStore' GameDVR_FSEBehaviorMode 2 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\GameDVR' AllowGameDVR 0 -Force -EA 0
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c -EA 0
          powercfg -duplicatescheme e9a42b02-d5df-448d-aa00-03f14749eb61 -EA 0
          powercfg -h off -EA 0
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PERFINCPOL 2 -EA 0
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PERFDECPOL 1 -EA 0
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMAX 100 -EA 0
          powercfg /setacvalueindex SCHEME_CURRENT SUB_PROCESSOR PROCTHROTTLEMIN 100 -EA 0
          powercfg /setacvalueindex SCHEME_CURRENT SUB_DISK DISKIDLE 0 -EA 0
          powercfg /setacvalueindex SCHEME_CURRENT SUB_SLEEP STANDBYIDLE 0 -EA 0
          powercfg /setactive SCHEME_CURRENT -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' Win32PrioritySeparation 38 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' LargeSystemCache 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' DisablePagingExecutive 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' ClearPageFileAtShutdown 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' IoPageLockLimit 983040 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' EnablePrefetcher 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' EnableSuperfetch 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' NtfsDisableLastAccessUpdate 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' NtfsDisable8dot3NameCreation 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' NtfsMemoryUsage 2 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' Executive 1 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Serialize' StartupDelayInMSec 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Serialize' StartupDelayInMSec 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Power' HiberbootEnabled 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Power\PowerThrottling' PowerThrottlingOff 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' CsEnabled 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Power' PlatformAoAcOverride 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' NetworkThrottlingIndex -Value 0xffffffff -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' SystemResponsiveness -Value 0 -Force -EA 0
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games' -Force -EA 0 | Out-Null
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games' 'GPU Priority' -Value 8 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games' Priority -Value 6 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games' 'Scheduling Category' -Value 'High' -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games' 'SFIO Priority' -Value 'High' -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\GraphicsDrivers' HwSchMode -Value 2 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' DefaultTTL 64 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' EnableTCPA 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' EnableRSS 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' EnableDCA 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' Tcp1323Opts 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' TcpMaxDataRetransmissions 5 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' TcpTimedWaitDelay 30 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' MaxUserPort 65534 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' TcpNumConnections 16777214 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' EnablePMTUBHDetect 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' EnablePMTUDiscovery 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' GlobalMaxTcpWindowSize 65535 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' TcpWindowSize 65535 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' SackOpts 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' TcpMaxDupAcks 2 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters' SynAttackProtect 1 -Force -EA 0
          Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services\Tcpip\Parameters\Interfaces' | ForEach-Object {
            Set-ItemProperty $_.PSPath TcpAckFrequency 1 -Force -EA 0
            Set-ItemProperty $_.PSPath TCPNoDelay 1 -Force -EA 0
            Set-ItemProperty $_.PSPath TcpDelAckTicks 0 -Force -EA 0
            Set-ItemProperty $_.PSPath TcpInitialRTT 2 -Force -EA 0
          }
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer' NoInstrumentation 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection' AllowTelemetry 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\DataCollection' DoNotShowFeedbackNotifications 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\DataCollection' AllowTelemetry 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' NoAutoUpdate 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU' AUOptions 1 -Force -EA 0
          Set-Service wuauserv -StartupType Disabled -EA 0
          Stop-Service wuauserv -Force -EA 0
          Set-Service UsoSvc -StartupType Disabled -EA 0
          Stop-Service UsoSvc -Force -EA 0
          Set-Service WaaSMedicSvc -StartupType Disabled -EA 0
          Stop-Service WaaSMedicSvc -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' HideFileExt 0 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' Hidden 1 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' ShowSuperHidden 1 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' LaunchTo 1 -Force -EA 0
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced' TaskbarSmallIcons 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl' AutoReboot 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl' CrashDumpEnabled 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl' LogEvent 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CrashControl' SendAlert 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\kernel' GlobalTimerResolutionRequests 1 -Force -EA 0

      - name: Clean System
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          Remove-Item "$env:TEMP\*" -Recurse -Force -EA 0
          Remove-Item "C:\Windows\Temp\*" -Recurse -Force -EA 0
          Remove-Item "C:\Windows\Prefetch\*" -Recurse -Force -EA 0
          Remove-Item "C:\Windows\SoftwareDistribution\Download\*" -Recurse -Force -EA 0
          Remove-Item "$env:LOCALAPPDATA\Temp\*" -Recurse -Force -EA 0
          Clear-RecycleBin -Force -EA 0
          Clear-DnsClientCache -EA 0

      - name: Remove Bloatware
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          $bloat = @("*Xbox*","*OneDrive*","*Teams*","*Bing*","*Cortana*","*Skype*","*Zune*","*3D*","*MixedReality*","*People*","*Photos*","*Camera*","*Weather*","*News*","*Mail*","*Calendar*","*Maps*","*Groove*","*Movies*","*Solitaire*","*Feedback*","*GetHelp*","*Getstarted*","*Tips*","*YourPhone*","*WindowsMaps*","*WindowsAlarms*","*WindowsCalculator*","*WindowsCommunicationsApps*","*WindowsFeedbackHub*","*WindowsReadingList*","*WindowsSoundRecorder*","*MicrosoftOfficeHub*","*MicrosoftStickyNotes*","*MicrosoftSolitaireCollection*","*MicrosoftTodos*","*MicrosoftPay*","*MicrosoftWallet*","*OneConnect*","*Advertising*","*Autodesk*","*Disney*","*Duolingo*","*EclipseManager*","*Facebook*","*Spotify*","*Adobe*","*Keeper*","*Pandora*","*Sway*","*Twitter*","*Netflix*","*CandyCrush*","*BubbleWitch*","*MarchofEmpires*","*Wunderlist*")
          foreach ($b in $bloat) {
            Get-AppxPackage -AllUsers $b -EA 0 | Remove-AppxPackage -EA 0
            Get-AppxProvisionedPackage -Online -EA 0 | Where-Object { $_.DisplayName -like $b } | Remove-AppxProvisionedPackage -Online -EA 0 | Out-Null
          }

      - name: Network Optimization
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          netsh int tcp set global autotuninglevel=normal 2>&1 | Out-Null
          netsh int tcp set global chimney=enabled 2>&1 | Out-Null
          netsh int tcp set global dca=enabled 2>&1 | Out-Null
          netsh int tcp set global ecncapability=enabled 2>&1 | Out-Null
          netsh int tcp set global timestamps=disabled 2>&1 | Out-Null
          netsh int tcp set global rss=enabled 2>&1 | Out-Null
          netsh int tcp set heuristics disabled 2>&1 | Out-Null
          netsh int tcp set supplemental Internet congestionprovider=ctcp 2>&1 | Out-Null
          netsh int tcp set global rsc=enabled 2>&1 | Out-Null
          netsh int tcp set global sack=enabled 2>&1 | Out-Null
          netsh int tcp set global initialRto=2000 2>&1 | Out-Null
          netsh int tcp set global nonsackrttresiliency=disabled 2>&1 | Out-Null
          netsh int tcp set global maxsynretransmissions=2 2>&1 | Out-Null
          netsh int tcp set global fastopen=enabled 2>&1 | Out-Null
          netsh int tcp set global fastopenfallback=enabled 2>&1 | Out-Null
          netsh int tcp set global prr=disabled 2>&1 | Out-Null
          netsh int tcp set global pacingprofile=off 2>&1 | Out-Null
          Disable-NetAdapterBinding -Name "*" -ComponentID ms_tcpip6 -EA 0
          Disable-NetAdapterBinding -Name "*" -ComponentID ms_lldp -EA 0
          Disable-NetAdapterBinding -Name "*" -ComponentID ms_lltdio -EA 0
          Disable-NetAdapterBinding -Name "*" -ComponentID ms_rspndr -EA 0
          Disable-NetAdapterBinding -Name "*" -ComponentID ms_implat -EA 0
          Disable-NetAdapterBinding -Name "*" -ComponentID ms_msclient -EA 0
          Disable-NetAdapterBinding -Name "*" -ComponentID ms_pacer -EA 0
          Disable-NetAdapterBinding -Name "*" -ComponentID ms_server -EA 0
          Get-NetAdapter -EA 0 | Set-DnsClientServerAddress -ServerAddresses ("1.1.1.1","1.0.0.1") -EA 0

      - name: Enable RDP
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' UserAuthentication 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' SecurityLayer 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' MinEncryptionLevel 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' MaxInstanceCount 99 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' fEnableWinStation 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' ColorDepth 4 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' fDisableClip 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' fDisableCdm 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' fDisableAudioCapture 0 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' fDisableCameraRedir 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' fDisablePNPRedir 1 -Force -EA 0
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' fAutoClientLptsBlt 0 -Force -EA 0
          netsh advfirewall firewall delete rule name="RDP" > $null 2>&1
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389 > $null 2>&1
          netsh advfirewall firewall set rule group="remote desktop" new enable=Yes > $null 2>&1
          Restart-Service TermService -Force -EA 0

      - name: Create User
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          secedit /export /cfg C:\secpol.cfg 2>&1 | Out-Null
          (Get-Content C:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" `
            -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0" `
            -replace "PasswordHistorySize = \d+", "PasswordHistorySize = 0" `
            -replace "MaximumPasswordAge = \d+", "MaximumPasswordAge = -1" `
            -replace "MinimumPasswordAge = \d+", "MinimumPasswordAge = 0" | Set-Content C:\secpol.cfg
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY 2>&1 | Out-Null
          Remove-Item C:\secpol.cfg -Force -EA 0
          Get-LocalUser User -EA 0 | Remove-LocalUser -EA 0
          net user User beta12345 /add /y 2>$null
          net localgroup Administrators User /add 2>$null
          net localgroup "Remote Desktop Users" User /add 2>$null
          Set-LocalUser -Name User -PasswordNeverExpires $true -EA 0
          Set-LocalUser -Name User -AccountNeverExpires -EA 0
          "RDP_PASS=beta12345" | Out-File $env:GITHUB_ENV -Append
          "RDP_USER=User" | Out-File $env:GITHUB_ENV -Append

      - name: Install Tailscale
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $msi = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
          Remove-Item $msi -Force -EA 0

      - name: Connect Tailscale
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-$env:GITHUB_RUN_ID --accept-routes
          $ip = $null
          for ($i=0; $i -lt 15; $i++) {
            $ip = (& $ts ip -4) 2>$null
            if ($ip) { break }
            Start-Sleep -Seconds 3
          }
          if (-not $ip) { Write-Error "No IP"; exit 1 }
          "TS_IP=$ip" | Out-File $env:GITHUB_ENV -Append

      - name: Verify RDP
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          Start-Sleep -Seconds 5
          $ok = Test-NetConnection -ComputerName $env:TS_IP -Port 3389 -InformationLevel Quiet
          if (-not $ok) {
            Start-Sleep -Seconds 5
            $ok = Test-NetConnection -ComputerName $env:TS_IP -Port 3389 -InformationLevel Quiet
          }
          if (-not $ok) { Write-Error "Port fail"; exit 1 }

      - name: Install Browsers
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          try {
            $chrome = "$env:TEMP\chrome.exe"
            Invoke-WebRequest "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $chrome -UseBasicParsing
            Start-Process $chrome -ArgumentList "/silent","/install" -Wait
            Remove-Item $chrome -Force -EA 0
          } catch { }
          try {
            $edge = "$env:TEMP\edge.exe"
            Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2108834" -OutFile $edge -UseBasicParsing
            Start-Process $edge -ArgumentList "/silent","/install" -Wait
            Remove-Item $edge -Force -EA 0
          } catch { }

      - name: Send Discord
        shell: pwsh
        continue-on-error: true
        run: |
          # Start
          $ErrorActionPreference = "SilentlyContinue"
          $embed = @{
            title = "Zeta RDP Online"
            description = "RDP ready to connect"
            color = 0
            thumbnail = @{ url = "https://cdn-icons-png.flaticon.com/512/3275/3275226.png" }
            fields = @(
              @{ name = "Address";  value = "``$env:TS_IP``"; inline = $true }
              @{ name = "Username"; value = "``$env:RDP_USER``"; inline = $true }
              @{ name = "Password"; value = "``$env:RDP_PASS``"; inline = $false }
              @{ name = "Port";     value = "``3389``"; inline = $true }
              @{ name = "Hostname"; value = "``gh-$env:GITHUB_RUN_ID``"; inline = $true }
            )
            footer = @{
              text = "Zeta RDP $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
              icon_url = "https://cdn-icons-png.flaticon.com/512/3275/3275226.png"
            }
          }
          $body = @{
            content = "@here"
            username = "Zeta RDP Bot"
            avatar_url = "https://cdn-icons-png.flaticon.com/512/3275/3275226.png"
            embeds = @($embed)
          } | ConvertTo-Json -Depth 8
          try {
            Invoke-RestMethod -Uri "${{ secrets.DISCORD_WEBHOOK }}" -Method Post -Body $body -ContentType "application/json"
          } catch { }

      - name: Keep Alive
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 600
          }
