name: RDP-Fast

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: System Tweaks
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $svcs = @("DiagTrack","dmwappushservice","SysMain","WSearch","MapsBroker","RetailDemo","XblAuthManager","XblGameSave","XboxNetApiSvc","XboxGipSvc","WerSvc","Fax","PhoneSvc","PrintNotify","RemoteRegistry","wisvc","WMPNetworkSvc","Cortana","OneSyncSvc","MessagingService","PcaSvc","TabletInputService","FontCache","Spooler","BluetoothUserService","bthserv","ShellHWDetection","SCardSvr","ScDeviceEnum","WbioSrvc","SensrSvc","SensorService","WebClient","stisvc","WiaRpc","WalletService","TokenBroker","TapiSrv","SmsRouter","NcaSvc","NcbService","RmSvc","icssvc","lfsvc","SEMgrSvc","NaturalAuthentication")
          foreach ($svc in $svcs) {
            $s = Get-Service -Name $svc -ErrorAction SilentlyContinue
            if ($s) {
              Stop-Service -Name $svc -Force -ErrorAction SilentlyContinue
              Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue
            }
          }

          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects' VisualFXSetting 2 -Force
          Set-ItemProperty 'HKCU:\Control Panel\Desktop\WindowMetrics' MinAnimate 0 -Force
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize' EnableTransparency 0 -Force
          Set-ItemProperty 'HKCU:\Control Panel\Desktop' MenuShowDelay 0 -Force
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' AppsUseLightTheme 0 -Force
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\CurrentVersion\Themes\Personalize' SystemUsesLightTheme 0 -Force
          New-Item -Path 'HKCU:\SOFTWARE\Microsoft\Windows\DWM' -Force | Out-Null
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\DWM' AccentColor 0xFF000000 -Force
          Set-ItemProperty 'HKCU:\SOFTWARE\Microsoft\Windows\DWM' EnableWindowColorization 1 -Force

          Set-MpPreference -DisableRealtimeMonitoring $true
          Set-MpPreference -DisableBehaviorMonitoring $true
          Set-MpPreference -DisableIOAVProtection $true
          Set-MpPreference -DisableScriptScanning $true

          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' EnableLUA 0 -Force

          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl' Win32PrioritySeparation 38 -Force
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' LargeSystemCache 1 -Force
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' DisablePagingExecutive 1 -Force
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' EnablePrefetcher 0 -Force
          Set-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management\PrefetchParameters' EnableSuperfetch 0 -Force

          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' NetworkThrottlingIndex -Value 0xffffffff -Force
          Set-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile' SystemResponsiveness -Value 0 -Force

          Set-Service wuauserv -StartupType Disabled
          Stop-Service wuauserv -Force

          Remove-Item "$env:TEMP\*" -Recurse -Force
          Remove-Item "C:\Windows\Temp\*" -Recurse -Force
          Remove-Item "C:\Windows\Prefetch\*" -Recurse -Force

          Get-AppxPackage -AllUsers *Xbox* | Remove-AppxPackage
          Get-AppxPackage -AllUsers *OneDrive* | Remove-AppxPackage
          Get-AppxPackage -AllUsers *Teams* | Remove-AppxPackage
          Get-AppxPackage -AllUsers *Bing* | Remove-AppxPackage
          Get-AppxPackage -AllUsers *Cortana* | Remove-AppxPackage
          Get-AppxPackage -AllUsers *Skype* | Remove-AppxPackage
          Get-AppxPackage -AllUsers *Zune* | Remove-AppxPackage
          Get-AppxPackage -AllUsers *Solitaire* | Remove-AppxPackage

      - name: Enable RDP
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' fDenyTSConnections 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' UserAuthentication 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' SecurityLayer 0 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' MinEncryptionLevel 1 -Force
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' MaxInstanceCount 99 -Force
          netsh advfirewall firewall delete rule name="RDP"
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service TermService -Force

      - name: Create User
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          secedit /export /cfg C:\secpol.cfg | Out-Null
          (Get-Content C:\secpol.cfg) -replace "PasswordComplexity = 1", "PasswordComplexity = 0" -replace "MinimumPasswordLength = \d+", "MinimumPasswordLength = 0" | Set-Content C:\secpol.cfg
          secedit /configure /db C:\Windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY | Out-Null
          Remove-Item C:\secpol.cfg -Force
          Remove-LocalUser -Name "User" -ErrorAction SilentlyContinue
          net user User beta12345 /add /y
          net localgroup Administrators User /add
          net localgroup "Remote Desktop Users" User /add
          Set-LocalUser -Name User -PasswordNeverExpires $true
          "RDP_PASS=beta12345" | Out-File $env:GITHUB_ENV -Append
          "RDP_USER=User" | Out-File $env:GITHUB_ENV -Append

      - name: Install Tailscale
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $msi = "$env:TEMP\ts.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
          Remove-Item $msi -Force

      - name: Connect Tailscale
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $ts up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-$env:GITHUB_RUN_ID --accept-routes
          Start-Sleep -Seconds 10
          $ip = & $ts ip -4
          Write-Host "Tailscale IP: $ip"
          if (-not $ip) { Write-Error "No IP"; exit 1 }
          "TS_IP=$ip" | Out-File $env:GITHUB_ENV -Append

      - name: Verify
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          Start-Sleep -Seconds 5
          $ok = Test-NetConnection -ComputerName $env:TS_IP -Port 3389 -InformationLevel Quiet
          if (-not $ok) { Write-Error "Port fail"; exit 1 }

      - name: Install Browsers
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          Invoke-WebRequest "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile "$env:TEMP\chrome.exe" -UseBasicParsing
          Start-Process "$env:TEMP\chrome.exe" -ArgumentList "/silent","/install" -Wait
          Remove-Item "$env:TEMP\chrome.exe" -Force
          Invoke-WebRequest "https://go.microsoft.com/fwlink/?linkid=2108834" -OutFile "$env:TEMP\edge.exe" -UseBasicParsing
          Start-Process "$env:TEMP\edge.exe" -ArgumentList "/silent","/install" -Wait
          Remove-Item "$env:TEMP\edge.exe" -Force

      - name: Send Discord
        shell: pwsh
        continue-on-error: true
        run: |
          $ErrorActionPreference = "SilentlyContinue"
          $embed = @{
            title = "Zeta RDP Online"
            description = "RDP ready to connect"
            color = 0
            fields = @(
              @{ name = "Address";  value = "``$env:TS_IP``"; inline = $true }
              @{ name = "Username"; value = "``$env:RDP_USER``"; inline = $true }
              @{ name = "Password"; value = "``$env:RDP_PASS``"; inline = $false }
              @{ name = "Port";     value = "``3389``"; inline = $true }
            )
            footer = @{ text = "Zeta RDP $(Get-Date -Format 'yyyy-MM-dd HH:mm')" }
          }
          $body = @{
            content = "@here"
            username = "Zeta RDP Bot"
            embeds = @($embed)
          } | ConvertTo-Json -Depth 8
          Invoke-RestMethod -Uri "${{ secrets.DISCORD_WEBHOOK }}" -Method Post -Body $body -ContentType "application/json"

      - name: Keep Alive
        shell: pwsh
        run: |
          while ($true) {
            Start-Sleep -Seconds 600
          }
